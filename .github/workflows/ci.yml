name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run boundaries
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      # Deterministic performance checks run in CI through the pure evaluator
      # suite. The GPU scenario runs manually on the reference M5 Pro
      # via `node scripts/perf-lite.mjs --tier S|L --runs 3 --enforce`.
      - run: pnpm run perf:gate
      - run: pnpm run build
      - run: pnpm run demo:build

  e2e:
    # BLOCKING GATE (restored v0.11.2 after being opt-in since v0.10). During
    # that opt-in period, a speed-preset field changed and two e2e assertions
    # stayed red for three releases. One assertion remains CI-skipped —
    # the lasso polygon hit-test, which selects zero nodes under SwiftShader
    # while passing on every real GPU; it still runs on every local pass.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/demo
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The browser CDN download can stall indefinitely (it once ate the whole
      # 20-minute job budget). Kill a stalled attempt after 4 minutes and
      # retry instead of hanging.
      - name: Install Playwright Chromium
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout 240 pnpm --filter orbit-demo exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install attempt ${attempt} failed or stalled; retrying" >&2
            sleep 5
          done
          exit 1
      - run: pnpm --filter orbit-demo e2e
        env:
          # Smaller streamed feed on CI: the runner renders through a software
          # rasterizer (SwiftShader), and SIM-HOT rendering over the full
          # 30K-row feed can starve input events — cosmos 3.4's on-demand
          # rendering only helps idle gaps, not active streaming.
          # Raising this back toward 30000 is a separate canary experiment.
          STREAM_ROWS: '12000'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-playwright
          path: |
            apps/demo/playwright-report/
            apps/demo/test-results/
          if-no-files-found: ignore
          retention-days: 7

  omnigraph:
    # Exercise the current protocol against an actual pinned server. The
    # recordings stay useful for fast unit tests, but cannot replace this gate.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMNIGRAPH_LIVE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install OmniGraph 0.14.0
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/omnigraph-0.14.0"
          cd "$RUNNER_TEMP/omnigraph-0.14.0"
          release_url=https://github.com/ModernRelay/omnigraph/releases/download/v0.14.0
          curl --fail --location --retry 3 "$release_url/omnigraph-linux-x86_64.tar.gz" -o omnigraph-linux-x86_64.tar.gz
          curl --fail --location --retry 3 "$release_url/omnigraph-linux-x86_64.sha256" -o omnigraph-linux-x86_64.sha256
          sha256sum --check omnigraph-linux-x86_64.sha256
          tar -xzf omnigraph-linux-x86_64.tar.gz
          "$RUNNER_TEMP/omnigraph-0.14.0/omnigraph" version
          {
            echo "OMNIGRAPH_BIN=$RUNNER_TEMP/omnigraph-0.14.0/omnigraph"
            echo "OMNIGRAPH_SERVER_BIN=$RUNNER_TEMP/omnigraph-0.14.0/omnigraph-server"
          } >> "$GITHUB_ENV"
      - name: Install Playwright Chromium
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout 240 pnpm --filter orbit-demo exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install attempt ${attempt} failed or stalled; retrying" >&2
            sleep 5
          done
          exit 1
      - name: Live export and stored-query integration
        run: pnpm --filter orbit-demo exec playwright test e2e/omnigraph.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: omnigraph-playwright
          path: |
            apps/demo/playwright-report/
            apps/demo/test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run cosmos:pin-check
      - run: pnpm run build
      - run: pnpm run smoke
      - run: pnpm run probe:node
      - run: pnpm run svg:node-fixture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-node-${{ matrix.node }}
          path: |
            .smoke/*.tgz
            .smoke/report.json
