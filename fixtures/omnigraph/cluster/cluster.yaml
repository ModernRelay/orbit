# Orbit fixture cluster — the smallest valid cluster config that serves one
# graph ("demo"). scripts/omnigraph-fixture.mjs copies this declaration into
# a fresh temporary root, applies it, then serves that isolated cluster.
#
# Deliberately minimal: no embedding provider or Cedar policies;
# the stored read query exercises search identity.
version: 1
metadata:
  name: orbit-fixture
state:
  backend: cluster
  lock: true
graphs:
  demo:
    schema: demo.pg
    queries: queries.gq
